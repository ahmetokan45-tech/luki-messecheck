function safeStorageRead(k){try{return window.localStorage.getItem(k)}catch(e){return null}}function safeStorageWrite(k,v){try{window.localStorage.setItem(k,v);return true}catch(e){return false}}function safeJson(s){try{return JSON.parse(s)||{}}catch{return {}}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){if(safeStorageWrite(STORAGE,JSON.stringify(config)))toast('Änderungen gespeichert');else toast('Lokale Speicherung hier nicht verfügbar. Bitte über Safari-Webadresse öffnen.')}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2700)}function allJobs(){return JOBS.map(j=>({...j,...(config.jobOverrides?.[j.id]||{})}))}function job(id){return allJobs().find(x=>x.id===id)}function btn(label,fn,cls='secondary'){return `<button class="${cls}" data-action="${fn}">${label}</button>`}function renderNav(){const items=[['home','⌂','Start'],['match','✦','Berufe-Match'],['jobs','⚒','Berufe'],['company','▣','Über uns'],['contact','▦','Kontakt']];document.getElementById('nav').innerHTML=items.map(([v,i,n])=>`<button data-view="${v}" class="${view===v?'active':''}"><b>${i}</b>${n}</button>`).join('')}

function computeMatch(){let scores={};for(const j of JOBS)scores[j.id]=0;answers.forEach((a,i)=>{(QUESTIONS[i]?.a[a]?.[1]||[]).forEach(tag=>JOBS.forEach(j=>{if(j.tags.includes(tag))scores[j.id]+=2}))});return JOBS.slice().sort((a,b)=>scores[b.id]-scores[a.id]||a.name.localeCompare(b.name)).slice(0,3).map(j=>({...j,score:scores[j.id]}))}
function explainMatch(j){let tally={};answers.forEach((a,i)=>(QUESTIONS[i]?.a[a]?.[1]||[]).forEach(t=>{if(j.tags.includes(t))tally[t]=(tally[t]||0)+1}));const names={outdoor:'gerne draußen bist',hands:'praktisch arbeitest',team:'Teamarbeit magst',build:'etwas erschaffen möchtest',machines:'dich für Maschinen interessierst',vehicles:'Fahrzeuge spannend findest',tech:'technische Aufgaben magst',precision:'genau arbeitest',numbers:'Zahlen und Messen magst',office:'dir Büroarbeit vorstellen kannst',organize:'gerne organisierst',people:'mit Menschen arbeiten möchtest',independent:'gerne eigenständig arbeitest'};const keys=Object.keys(tally).sort((a,b)=>tally[b]-tally[a]).slice(0,2);return keys.length?'Deine Antworten deuten darauf hin, dass du '+keys.map(k=>names[k]||k).join(' und ')+'.':'Dieser Beruf könnte zu deinen Interessen passen.'}

function benefitsPage(){const benefits=[['🎫','JugendTicketBW','Zuschuss beziehungsweise Übernahme laut Ausbildungsbroschüre.'],['👕','Arbeitskleidung','Arbeitskleidung von Engelbert Strauss.'],['🤝','Azubi-Gemeinschaft','Azubi-Ausflüge, gemeinsame Aktionen, Sommerfest und Weihnachtsfeier.'],['🛠️','Eigene Projekte','Gemeinsame Azubi-Projekte, bei denen ihr Verantwortung übernehmt.'],['📅','Freitag frei','Bei den in der Broschüre gekennzeichneten gewerblichen Ausbildungsberufen.'],['🚀','Karrierewege','Weiterentwicklung über Fach- und Führungsaufgaben sowie Fortbildungen.']];return `<span class="kicker">DEINE ZUKUNFT</span><h1 class="page-title">Mehr als nur eine Ausbildung.</h1><p class="lead">${esc(config.benefits)}</p><div class="info-grid spaced">${benefits.map(x=>`<article class="panel"><div style="font-size:38px">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div><div class="panel spaced"><h3>Deine Perspektiven</h3><p>Im gewerblichen Bereich kannst du dich beispielsweise zum Vorarbeiter, Werkpolier, geprüften Polier, Meister oder Bautechniker weiterentwickeln. Im kaufmännischen Bereich sind unter anderem Fachwirt-, Teamleitungs- und Bereichsleitungswege möglich. Welche Wege konkret offenstehen, besprechen wir persönlich.</p><p class="muted">Angaben aus der bereitgestellten Ausbildungsbroschüre; aktuelle Konditionen vor der Messe bestätigen.</p></div>`}

function contactPage(){let career=config.careerUrl,match=config.matchUrl||(location.protocol==='https:'?location.href.split('#')[0]:'');return `<span class="kicker">PRAKTIKUM & KONTAKT</span><h1 class="page-title">Probier deinen Weg aus.</h1><p class="lead">Ob Schulpraktikum oder Schnuppertag: Du kannst bei uns in verschiedene Ausbildungsberufe reinschauen. Sprich uns am Messestand an oder nutze unser Praktikumsformular.</p><div class="info-grid spaced"><article class="panel"><h3>📱 Ausbildungsseite</h3>${qrBlock(career)}</article><article class="panel"><h3>✦ Berufe-Match auf deinem Handy</h3>${qrBlock(match)}<p class="muted">Dafür ist später eine veröffentlichte Webadresse nötig.</p></article><article class="panel"><h3>✉ Praktikum anfragen</h3><p>Das Formular ist im Messepaket enthalten. Ausfüllen und an <strong>${esc(config.contactEmail)}</strong> senden.</p><a class="secondary" style="display:inline-block;text-decoration:none" href="Praktikumsanfrage.pdf" target="_blank">Praktikumsformular öffnen ↗</a><p class="footer-note">Für das Praktikum wird ein Versicherungsnachweis benötigt (Schulpraktikum: Schule; freiwillig: Krankenkasse/Familie).</p></article></div><div class="info-grid spaced"><article class="panel"><h3>Gewerbliche Ausbildung</h3><div class="contact-person"><img src="assets/ahmet-sarizeybek.jpg" alt="Ahmet Sarizeybek"><p><strong>Ahmet Sarizeybek</strong><br>0152 / 54773141<br>ahmet.sarizeybek@lukas-glaeser.de</p></div></article><article class="panel"><h3>Kaufmännische Ausbildung</h3><div class="contact-person"><img src="assets/sophie-bunge.jpg" alt="Sophie Bunge"><p><strong>Sophie Bunge</strong><br>07191 / 213-140<br>sophie.bunge@lukas-glaeser.de</p></div></article><article class="panel"><h3>Ausbildungsbroschüre</h3><p>Alle Berufe und weitere Einblicke in unserer Broschüre.</p><a class="secondary" style="display:inline-block;text-decoration:none" href="Ausbildungsbroschuere.pdf" target="_blank">Broschüre öffnen ↗</a></article></div>${lastMatch?`<div class="panel spaced"><h3>Deine Berufsvorschläge</h3><p>${lastMatch.map(j=>esc(j.name)).join(' · ')}</p><p class="muted">Das Ergebnis wird nur in dieser Sitzung angezeigt.</p></div>`:''}`}
function challengePage(){if(challengeIndex>=CHALLENGE.length){let score=challengeAnswers.filter((x,i)=>x===CHALLENGE[i].correct).length;return `<div class="quiz"><span class="kicker">LUKI CHALLENGE</span><h1 class="page-title">${score} von ${CHALLENGE.length} richtig! 🎉</h1><p class="lead">Gut gemacht! Du kannst deinen Namen freiwillig in die lokale Bestenliste eintragen.</p><div class="panel"><div class="field"><label for="playerName">Dein Spitzname (optional, maximal 20 Zeichen)</label><input id="playerName" maxlength="20" placeholder="z. B. Bauprofi23"></div>${scoreSaved?'<p>✓ Dein Ergebnis ist eingetragen.</p>':btn('In Bestenliste eintragen','saveScore','primary')}</div>${scoreBoard()}<div class="actions spaced">${btn('Noch einmal spielen','startChallenge','ghost')} ${btn('Berufe entdecken','jobs','secondary')}</div></div>`}let q=CHALLENGE[challengeIndex];return `<div class="quiz"><span class="kicker">LUKI CHALLENGE · ${challengeIndex+1}/${CHALLENGE.length}</span><h1 class="page-title">Teste dein Bau-Wissen!</h1><div class="progress"><div style="width:${(challengeIndex+1)/CHALLENGE.length*100}%"></div></div><h2>${esc(q.q)}</h2>${q.a.map((a,i)=>`<button class="challenge-option ${challengeAnswers[challengeIndex]===i?'selected':''}" data-challenge-answer="${i}" ${challengeAnswers[challengeIndex]!==undefined?'disabled':''}>${esc(a)}</button>`).join('')}${challengeAnswers[challengeIndex]!==undefined?`<p class="notice">${challengeAnswers[challengeIndex]===q.correct?'✓ Richtig!':'Noch nicht ganz.'} ${esc(q.explain)}</p>`:''}<div class="actions spaced">${btn('Zur Startseite','home','ghost')}${btn('Weiter →','nextChallenge','secondary')}</div></div>`}
function adminPage(){if(!adminUnlocked)return adminLoginPage();return `<span class="kicker">VERWALTUNGSBEREICH</span><h1 class="page-title">MesseCheck verwalten</h1><p class="lead">Inhalte, Bilder, Video und Links bearbeiten. Einstellungen werden lokal auf diesem Gerät gespeichert.</p><div class="notice">Lokale Admin-Sperre: Für echten Zugriffsschutz und gemeinsame Statistiken wird später ein Server mit Benutzerverwaltung benötigt.</div><div class="admin-layout spaced"><div class="admin-nav">${[['dashboard','Statistik'],['general','Allgemein'],['links','Links & QR'],['media','Video & Bilder'],['jobs','Berufstexte'],['backup','Sicherung']].map(([k,n])=>`<button data-admin-tab="${k}" class="${adminTab===k?'active':''}">${n}</button>`).join('')}</div><div class="panel">${adminContent()}</div></div>`}

if(adminTab==='jobs')return `<h2>Berufstexte</h2><div class="field"><label>Beruf</label><select id="editJob">${JOBS.map(j=>`<option value="${j.id}" ${window.editJobId===j.id?'selected':''}>${esc(j.name)}</option>`).join('')}</select></div><div class="field"><label>Kurzbeschreibung</label><textarea id="jobDesc">${esc(job(window.editJobId||JOBS[0].id).desc)}</textarea></div>${btn('Berufstext speichern','saveJob','secondary')}`;
return `<h2>Sicherung & Übertragung</h2><p>Exportiere Texte und Einstellungen als JSON-Datei oder importiere eine frühere Sicherung.</p>${btn('Einstellungen exportieren','exportConfig','secondary')}<div class="field"><label>JSON-Sicherung importieren</label><input type="file" id="importConfig" accept="application/json,.json"></div><p class="notice">Der Import überschreibt gespeicherte Einstellungen. Medien sind nicht Teil der JSON-Sicherung.</p>${btn('Alle Einstellungen zurücksetzen','resetConfig','ghost')}`}
function openView(v){if(v==='admin'&&!adminUnlocked)v='adminLogin';if(view!==v)historyStack.push(view);view=v;if(v==='job')statEvent('view',window.selectedJob||'');render()}function startMatch(){qIndex=0;answers=[];lastMatch=null;statEvent('matchStart');openView('match')}function nextQuestion(){if(answers[qIndex]===undefined){toast('Bitte wähle eine Antwort.');return}qIndex++;if(qIndex===QUESTIONS.length)statEvent('matchEnd');render()}function prevQuestion(){if(qIndex>0)qIndex--;else openView('home');render()}function startChallenge(){challengeIndex=0;challengeAnswers=[];challengeStartedAt=Date.now();scoreSaved=false;statEvent('quizStart');openView('challenge')}function nextChallenge(){if(challengeAnswers[challengeIndex]===undefined){toast('Bitte wähle eine Antwort.');return}challengeIndex++;if(challengeIndex===CHALLENGE.length)statEvent('quizEnd');render()}
function resetIdle(){clearTimeout(idleTimer);clearTimeout(idleWarningTimer);document.getElementById('idleOverlay').classList.add('hidden');if(document.getElementById('attract').classList.contains('hidden')&&view!=='admin'&&view!=='adminLogin'){let ms=Math.max(30,Number(config.idleSeconds)||180)*1000;idleWarningTimer=setTimeout(()=>document.getElementById('idleOverlay').classList.remove('hidden'),ms-15000);idleTimer=setTimeout(showAttract,ms)}}function showAttract(){clearTimeout(idleTimer);clearTimeout(idleWarningTimer);document.getElementById('idleOverlay').classList.add('hidden');document.getElementById('attract').classList.remove('hidden');view='home';historyStack=[];qIndex=0;answers=[];lastMatch=null;challengeAnswers=[];challengeIndex=0;adminUnlocked=false;render();document.getElementById('introVideo').play().catch(()=>{})}function enter(){document.getElementById('attract').classList.add('hidden');document.getElementById('introVideo').pause();statEvent('visit');openView('home')}
async function db(){return new Promise((resolve,reject)=>{let r=indexedDB.open('luki-messecheck-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function mediaPut(key,file){let d=await db();return new Promise((res,rej)=>{let t=d.transaction('media','readwrite');t.objectStore('media').put(file,key);t.oncomplete=()=>{d.close();res()};t.onerror=()=>rej(t.error)})}async function mediaGet(key){let d=await db();return new Promise((res,rej)=>{let t=d.transaction('media','readonly');let r=t.objectStore('media').get(key);r.onsuccess=()=>{d.close();res(r.result)};r.onerror=()=>rej(r.error)})}async function mediaDelete(key){let d=await db();return new Promise((res,rej)=>{let t=d.transaction('media','readwrite');t.objectStore('media').delete(key);t.oncomplete=()=>{d.close();res()};t.onerror=()=>rej(t.error)})}async function refreshMedia(key){if(mediaUrls[key])URL.revokeObjectURL(mediaUrls[key]);const f=await mediaGet(key);mediaUrls[key]=f?URL.createObjectURL(f):'';if(key==='video'){const v=document.getElementById('introVideo');v.src=mediaUrls[key]||'';v.load();if(!document.getElementById('attract').classList.contains('hidden'))v.play().catch(()=>{})}else if(view==='jobs'||view==='job')render()}
function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function goBack(){let prev=historyStack.pop()||'home';view=prev;render()}
function saveScore(){if(scoreSaved){toast('Ergebnis bereits eingetragen');return}let input=document.getElementById('playerName');let name=(input?.value||'').trim().replace(/[<>]/g,'').slice(0,20);if(!name){toast('Bitte einen Spitznamen eingeben.');return}let s=stats();let points=challengeAnswers.filter((x,i)=>x===CHALLENGE[i].correct).length;s.scores.push({name,points,seconds:Math.max(1,Math.round((Date.now()-challengeStartedAt)/1000)),date:new Date().toISOString()});saveStats(s);scoreSaved=true;toast('Highscore gespeichert');render()}
function doAction(action){if(action==='saveScore')return saveScore();if(action==='goBack')return goBack();if(action==='logoutAdmin'){adminUnlocked=false;return openView('home')}if(action==='clearScores'){if(confirm('Alle Highscores auf diesem Gerät löschen?')){let s=stats();s.scores=[];saveStats(s);render()}return}if(action==='clearStats'){if(confirm('Alle Besuchs- und Quizstatistiken auf diesem Gerät löschen?')){let scores=stats().scores;safeStorageWrite(DATA_KEY,JSON.stringify({scores}));render()}return}if(action==='exportStats'){let s=stats();let csv='Kennzahl;Wert\nBesuche gesamt;'+s.visits.length+'\nBesuche heute;'+todayCount(s.visits)+'\nChallenge gestartet;'+s.quizStarts.length+'\nChallenge beendet;'+s.quizEnds.length+'\nBerufe-Match gestartet;'+s.matchStarts.length+'\nBerufe-Match beendet;'+s.matchEnds.length;download('luki-messestatistik.csv',csv,'text/csv;charset=utf-8');return}if(action==='adminLogin'){let val=document.getElementById('adminPassword')?.value||'';checkAdminPassword(val).then(ok=>{if(ok){adminUnlocked=true;adminTab='dashboard';openView('admin')}else toast('Passwort nicht korrekt')});return}if(action.startsWith('openJob:')){window.selectedJob=action.split(':')[1];openView('job');return}if(action.startsWith('copyLink:')){let url=decodeURIComponent(action.slice(9));if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>toast('Link kopiert')).catch(()=>prompt('Link kopieren:',url));else prompt('Link kopieren:',url);return}if(action==='saveAdmin'){document.querySelectorAll('[data-config]').forEach(el=>{let k=el.dataset.config;config[k]=k==='idleSeconds'?Math.max(20,Number(el.value)||90):el.value.trim()});save();resetIdle();return}if(action==='saveJob'){let id=document.getElementById('editJob').value;config.jobOverrides=config.jobOverrides||{};config.jobOverrides[id]={...(config.jobOverrides[id]||{}),desc:document.getElementById('jobDesc').value};save();return}if(action==='exportConfig'){download('luki-messecheck-einstellungen.json',JSON.stringify(config,null,2),'application/json');return}if(action==='resetConfig'){if(confirm('Wirklich alle Texte und Einstellungen zurücksetzen?')){config={...DEFAULT,jobOverrides:{}};save();render()}return}if(action==='removeVideo'){mediaDelete('video').then(()=>refreshMedia('video')).then(()=>toast('Video entfernt'));return}if(action==='removeImage'){let id=document.getElementById('mediaJob').value;mediaDelete('job-'+id).then(()=>refreshMedia('job-'+id)).then(()=>toast('Bild entfernt'));return}if(action==='resultContact'){openView('contact');return}if(action==='nextQuestion')return nextQuestion();if(action==='prevQuestion')return prevQuestion();if(action==='startMatch')return startMatch();if(action==='startChallenge')return startChallenge();if(action==='nextChallenge')return nextChallenge();if(['home','jobs','contact','match'].includes(action))return openView(action)}
document.addEventListener('click',e=>{if(e.target.closest('#enterBtn')){e.stopPropagation();enter();return}let a=e.target.closest('[data-action]');if(a){doAction(a.dataset.action);return}let v=e.target.closest('[data-view]');if(v){if(v.dataset.view==='challenge')startChallenge();else if(v.dataset.view==='match')startMatch();else openView(v.dataset.view);return}let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}let ans=e.target.closest('[data-answer]');if(ans){answers[qIndex]=Number(ans.dataset.answer);render();return}let ch=e.target.closest('[data-challenge-answer]');if(ch){challengeAnswers[challengeIndex]=Number(ch.dataset.challengeAnswer);render();return}let tab=e.target.closest('[data-admin-tab]');if(tab){adminTab=tab.dataset.adminTab;render();return}resetIdle()});document.addEventListener('change',async e=>{if(e.target.id==='videoUpload'||e.target.id==='imageUpload'){let file=e.target.files[0];if(!file)return;if(e.target.id==='videoUpload'&&!['video/mp4','video/webm'].includes(file.type)){toast('Bitte MP4 oder WebM auswählen.');return}if(e.target.id==='imageUpload'&&!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Bitte JPG, PNG oder WebP auswählen.');return}let key=e.target.id==='videoUpload'?'video':'job-'+document.getElementById('mediaJob').value;try{await mediaPut(key,file);await refreshMedia(key);toast('Medium gespeichert')}catch{toast('Speichern fehlgeschlagen. Browser-Speicher prüfen.')}return}if(e.target.id==='editJob'){window.editJobId=e.target.value;render();return}if(e.target.id==='importConfig'){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(typeof data!=='object'||Array.isArray(data)||data===null)throw Error();if(confirm('Vorhandene Einstellungen durch diese Datei ersetzen?')){config={...DEFAULT,...data};save();render()}}catch{toast('Ungültige JSON-Datei')}return}});
document.getElementById('attract').addEventListener('click',enter);document.getElementById('enterBtn').addEventListener('click',function(e){e.preventDefault();e.stopPropagation();enter()});document.getElementById('attract').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enter()}});document.getElementById('homeBtn').addEventListener('click',showAttract);document.getElementById('backBtn').addEventListener('click',goBack);document.getElementById('adminBtn').addEventListener('click',()=>openView('admin'));document.getElementById('stayBtn').addEventListener('click',resetIdle);['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>resetIdle(),{passive:true}));Promise.all(['video',...JOBS.map(j=>'job-'+j.id)].map(k=>refreshMedia(k).catch(()=>{}))).then(()=>{});render();

if ('serviceWorker' in navigator && location.protocol==='https:') {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));}
</script></body></html>
